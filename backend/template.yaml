AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Rally leaderboard for Shermaine's portfolio. HTTP API -> Lambda -> DynamoDB,
  throttled, with an optional monthly budget alert. Deploys from the
  CloudFormation console with no CLI or build step (the Lambda code is inline).

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Your Amplify site URL, e.g. https://main.d1abc2def3.amplifyapp.com (no trailing slash). "*" allows any site.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Email for a US$1/month budget alert. Leave empty to skip.

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rally-table-access   # least privilege: two actions on one table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt ResultsTable.Arn

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-results
      RetentionInDays: 14

  ResultsFunction:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-results
      Runtime: python3.12
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
      Code:
        ZipFile: |
          """Rally leaderboard Lambda.

          POST /results  body {"shots": int, "reads": int, "you": int, "model": int}
                         -> records one finished match, returns the global totals
          GET  /stats    -> returns the global totals

          All totals live in ONE DynamoDB item updated with atomic ADD, so there is
          no scan, no race between concurrent players, and cost stays at one write
          and one read per match. No names or free text are stored.
          """
          import json
          import os

          import boto3

          TABLE = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          KEY = {"pk": "global"}
          POINTS_TO_WIN = 5
          HEADERS = {"content-type": "application/json", "cache-control": "no-store"}


          def _resp(status, body):
              return {"statusCode": status, "headers": HEADERS, "body": json.dumps(body)}


          def _totals(item):
              item = item or {}
              return {k: int(item.get(k, 0)) for k in ("matches", "shots", "reads", "visitorWins")}


          def validate(b):
              """Return a clean result dict, or None if the payload can't be a real finished match."""
              try:
                  shots, reads, you, model = (int(b[k]) for k in ("shots", "reads", "you", "model"))
              except (KeyError, TypeError, ValueError):
                  return None
              if not (0 <= you <= POINTS_TO_WIN and 0 <= model <= POINTS_TO_WIN):
                  return None
              if max(you, model) != POINTS_TO_WIN or you == model:
                  return None
              if not (1 <= shots <= 300 and 0 <= reads <= shots):
                  return None
              if reads < model or shots - reads < 3 * you:  # model points need a read; yours need 3 unread shots
                  return None
              return {"shots": shots, "reads": reads, "visitorWin": int(you > model)}


          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "GET")
              if method == "GET":
                  return _resp(200, _totals(TABLE.get_item(Key=KEY).get("Item")))

              try:
                  body = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return _resp(400, {"error": "Body must be JSON."})
              r = validate(body)
              if r is None:
                  return _resp(400, {"error": "Not a valid finished match."})

              out = TABLE.update_item(
                  Key=KEY,
                  UpdateExpression="ADD matches :one, shots :s, reads :r, visitorWins :w",
                  ExpressionAttributeValues={":one": 1, ":s": r["shots"], ":r": r["reads"], ":w": r["visitorWin"]},
                  ReturnValues="ALL_NEW",
              )
              return _resp(200, _totals(out.get("Attributes")))

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 3600

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ResultsFunction.Arn
      PayloadFormatVersion: "2.0"

  PostResults:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /results
      Target: !Sub integrations/${Integration}

  GetStats:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /stats
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:          # caps traffic so a viral link can't become a bill
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ResultsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 1, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  ApiUrl:
    Description: Paste this into config.js as window.RALLY_API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref ResultsTable
